name: Build ClearVoice APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Regression guard for the v1.0/v1.1 launch crash: a lateinit view
      # (lvRecordings) was never assigned but used in onCreate. Blocks
      # the build if any lateinit var in MainActivity lacks an assignment.
      - name: Check lateinit assignments (launch-crash guard)
        run: python3 scripts/check_lateinit.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's ubuntu runners already ship the Android SDK
      # (ANDROID_HOME + cmdline-tools). We install packages directly
      # with sdkmanager instead of android-actions/setup-android,
      # whose default legacy `tools` package no longer exists in the
      # SDK repository and fails the step ("Failed to find package
      # 'tools'", run 40867629774).
      # RNNoise is a native (C/C++) library — the NDK + CMake versions
      # here must match ndkVersion / externalNativeBuild in
      # app/build.gradle.kts.
      - name: Install Android SDK packages (platform, build-tools, NDK, CMake)
        run: |
          # sdkmanager is NOT on PATH on the runner — locate it under
          # the preinstalled SDK (run 40867766789: "command not found").
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -1)"
          echo "Using sdkmanager: $SDKMANAGER"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0" "platform-tools" "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClearVoice-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  screenshot:
    name: Emulator UI screenshots
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: ClearVoice-debug-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator and capture UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r apk/app-debug.apk
            adb shell am start -n com.hasan.clearvoice/.MainActivity
            sleep 6
            adb exec-out screencap -p > home.png
            adb shell am force-stop com.hasan.clearvoice
            adb shell am start -n com.hasan.clearvoice/.MainActivity --es open record
            sleep 4
            adb shell dumpsys activity activities | grep -m1 topResumedActivity || true
            adb exec-out screencap -p > record.png
            adb shell am force-stop com.hasan.clearvoice
            adb shell am start -n com.hasan.clearvoice/.MainActivity --es open clean
            sleep 4
            adb shell dumpsys activity activities | grep -m1 topResumedActivity || true
            adb exec-out screencap -p > clean.png
            adb shell am force-stop com.hasan.clearvoice
            adb shell am start -n com.hasan.clearvoice/.MainActivity --es open files
            sleep 4
            adb shell dumpsys activity activities | grep -m1 topResumedActivity || true
            adb exec-out screencap -p > files.png
            adb shell am force-stop com.hasan.clearvoice
            adb shell am start -n com.hasan.clearvoice/.MainActivity --es open settings
            sleep 4
            adb shell dumpsys activity activities | grep -m1 topResumedActivity || true
            adb exec-out screencap -p > settings.png
            adb logcat -d | grep -iE "FATAL|AndroidRuntime" | head -20 || true

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ClearVoice-UI-screenshots
          path: |
            home.png
            record.png
            clean.png
            files.png
            settings.png
          if-no-files-found: error
