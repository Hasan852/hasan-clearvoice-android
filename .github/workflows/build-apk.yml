name: Build ClearVoice APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's ubuntu runners already ship the Android SDK
      # (ANDROID_HOME + cmdline-tools). We install packages directly
      # with sdkmanager instead of android-actions/setup-android,
      # whose default legacy `tools` package no longer exists in the
      # SDK repository and fails the step ("Failed to find package
      # 'tools'", run 40867629774).
      # RNNoise is a native (C/C++) library — the NDK + CMake versions
      # here must match ndkVersion / externalNativeBuild in
      # app/build.gradle.kts.
      - name: Install Android SDK packages (platform, build-tools, NDK, CMake)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClearVoice-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
